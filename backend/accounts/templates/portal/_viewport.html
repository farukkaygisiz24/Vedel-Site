<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
<meta name="theme-color" content="#eeecea" />
<meta name="format-detection" content="telephone=no, date=no, address=no, email=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Vedel" />
<meta name="application-name" content="Vedel" />
<link rel="manifest" href="{% url 'portal-manifest' %}" />
<link rel="icon" href="{% url 'portal-favicon' %}" type="image/png" />
<link rel="apple-touch-icon" href="{% url 'portal-favicon' %}" />
{% include 'portal/_ios_zoom.html' %}
<style>
  html.vedel-device-preview,
  html.vedel-device-preview body {
    margin: 0 !important;
    width: 100% !important;
    height: 100% !important;
    min-height: 100vh !important;
    background: #d6d0ca !important;
  }
  html.vedel-device-preview body {
    display: grid !important;
    place-items: center !important;
    padding: 20px !important;
    overflow: auto !important;
  }
  html.vedel-device-preview body::before {
    display: none !important;
  }
  #vedel-device-root {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  #vedel-phone {
    position: relative;
    isolation: isolate;
    width: 390px;
    height: 844px;
    overflow: hidden;
    border-radius: 44px;
    background: #eeecea;
    box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.14), 0 28px 64px rgba(0, 0, 0, 0.22);
  }
  #vedel-phone::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(720px 380px at 12% -8%, rgba(220, 38, 38, 0.12), transparent 58%),
      radial-gradient(640px 420px at 96% 108%, rgba(31, 74, 68, 0.16), transparent 55%);
  }
  html.vedel-device-preview #vedel-phone .stage,
  html.vedel-device-preview #vedel-phone .app,
  html.vedel-device-preview #vedel-phone .tabs {
    position: relative;
    z-index: 1;
  }
  html.vedel-device-preview #vedel-phone .app {
    max-width: 390px;
    min-height: 844px;
  }
  html.vedel-device-preview .app-tabs {
    position: absolute;
    left: 0;
    right: 0;
    width: 390px;
    max-width: 390px;
  }
  html.vedel-device-preview #vedel-phone {
    display: grid;
    place-items: center;
    padding: 0;
  }
  .vedel-phone-meta {
    margin: 0;
    color: #6e6e73;
    font: 510 11px/1.3 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    letter-spacing: 0.04em;
  }
</style>
<script>
  (function () {
    var KEY = 'vedel-device';
    var params = new URLSearchParams(location.search);
    try {
      if (params.get('device') === '1') sessionStorage.setItem(KEY, '1');
      if (params.get('device') === '0') sessionStorage.removeItem(KEY);
    } catch (err) {}
    var on = false;
    try { on = sessionStorage.getItem(KEY) === '1'; } catch (err) {}
    if (!on) {
      if (location.pathname.indexOf('/field') === 0) return;
      var DESIGN = 1920;
      var MAX = 1.5;
      function apply() {
        var width = window.innerWidth;
        var zoom = Math.max(1, Math.min(width / DESIGN, MAX));
        document.documentElement.style.zoom = zoom === 1 ? '1' : String(zoom);
        document.body && (document.body.style.zoom = zoom === 1 ? '1' : String(zoom));
      }
      apply();
      window.addEventListener('resize', apply);
      document.addEventListener('DOMContentLoaded', apply);
      return;
    }

    document.documentElement.classList.add('vedel-device-preview');
    function mount() {
      if (document.getElementById('vedel-phone')) return;
      var phone = document.createElement('div');
      phone.id = 'vedel-phone';
      while (document.body.firstChild) phone.appendChild(document.body.firstChild);
      var root = document.createElement('div');
      root.id = 'vedel-device-root';
      var meta = document.createElement('p');
      meta.className = 'vedel-phone-meta';
      meta.textContent = 'iPhone 14 · 390 × 844';
      root.appendChild(phone);
      root.appendChild(meta);
      document.body.appendChild(root);
    }
    if (document.body) mount();
    else document.addEventListener('DOMContentLoaded', mount);
  })();
  (function () {
    var standalone = window.navigator.standalone === true ||
      (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
    var ios = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    document.documentElement.classList.toggle('is-standalone', standalone);
    document.documentElement.classList.toggle('is-ios-safari', Boolean(ios && !standalone));
    if (!standalone) return;
    document.addEventListener('click', function (event) {
      if (event.defaultPrevented || event.button !== 0) return;
      if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
      var link = event.target.closest && event.target.closest('a[href]');
      if (!link || link.hasAttribute('download')) return;
      var target = (link.getAttribute('target') || '').toLowerCase();
      if (target === '_blank' || target === '_parent' || target === '_top') return;
      var href = link.getAttribute('href');
      if (!href || href.charAt(0) === '#') return;
      var url;
      try { url = new URL(link.href, location.href); } catch (err) { return; }
      if (url.origin !== location.origin) return;
      if (url.pathname === location.pathname && url.search === location.search) return;
      event.preventDefault();
      location.href = url.href;
    }, true);
  })();
</script>
