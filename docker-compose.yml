services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vedel_b2c
      POSTGRES_USER: vedel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vedel}
    volumes:
      - vedel_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vedel -d vedel_b2c']
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - '5432:5432'
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://vedel:${POSTGRES_PASSWORD:-vedel}@db:5432/vedel_b2c
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-in-production-vedel-b2c}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend,servis.vedel.com.tr}
      DJANGO_CORS_ORIGINS: ${DJANGO_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:8000,http://127.0.0.1:8000}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
    command: ['sh', 'entrypoint.sh']
    ports:
      - '8000:8000'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  vedel_pgdata:
