<style>
  /* No double-tap zoom on taps; pinch zoom stays available */
  * { touch-action: manipulation; }

  /* Modals follow the area left above the on-screen keyboard (values set by the script below) */
  @media (max-width: 860px) {
    .modal,
    .field-modal {
      top: var(--vv-top, 0px);
      right: 0;
      bottom: auto;
      left: 0;
      height: var(--vv-height, 100%);
    }
  }

  /* Anything iOS still auto-links keeps the surrounding text style */
  a[x-apple-data-detectors] {
    color: inherit !important;
    font: inherit !important;
    text-decoration: none !important;
  }

  /* iOS Safari zooms into any field under 16px on focus */
  @supports (-webkit-touch-callout: none) {
    input:not([type="checkbox"]):not([type="radio"]):not([type="range"]),
    select,
    textarea {
      font-size: 16px !important;
    }
  }
</style>
<script>
  (function () {
    var vv = window.visualViewport;
    var phone = window.matchMedia ? window.matchMedia('(max-width: 860px)') : null;
    if (!vv || !phone) return;
    var root = document.documentElement;
    var locked = false;
    var savedY = 0;

    function syncViewport() {
      root.style.setProperty('--vv-height', vv.height + 'px');
      root.style.setProperty('--vv-top', vv.offsetTop + 'px');
    }

    // iOS pans the page when a field gets focus, even one already in view. A fixed body leaves
    // nothing to pan, so the modal stays put.
    function syncLock() {
      var body = document.body;
      var open = phone.matches && document.querySelector('.modal:not([hidden]), .field-modal:not([hidden])');
      if (open && !locked) {
        locked = true;
        savedY = window.scrollY;
        body.style.position = 'fixed';
        body.style.top = -savedY + 'px';
        body.style.left = '0';
        body.style.right = '0';
      } else if (!open && locked) {
        locked = false;
        body.style.position = '';
        body.style.top = '';
        body.style.left = '';
        body.style.right = '';
        window.scrollTo(0, savedY);
      }
    }

    syncViewport();
    vv.addEventListener('resize', syncViewport);
    vv.addEventListener('scroll', syncViewport);
    document.addEventListener('DOMContentLoaded', function () {
      syncLock();
      new MutationObserver(syncLock).observe(document.body, {
        childList: true,
        subtree: true,
        attributes: true,
        attributeFilter: ['hidden']
      });
    });
  })();
  (function () {
    var ios = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    if (!ios) return;
    // iOS keeps pinch zoom despite maximum-scale, but stops the focus auto-zoom
    var meta = document.querySelector('meta[name="viewport"]');
    if (meta && meta.content.indexOf('maximum-scale') === -1) {
      meta.content += ', maximum-scale=1';
    }
  })();
</script>
